[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-training-os"
version = "0.1.0"
description = "Local post-session poker training analysis for exported GG PokerCraft hand histories."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "polars>=1.0",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

